spring.application.name=bankapi

# credentials never live in this file - it is committed. set MONGODB_URI in the environment
# boot 4 moved these off the spring.data.* prefix. the old keys are deprecated at
# level=error, which means they are ignored silently and the client falls back to localhost
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=bankdb
# CORS allowed origins for the frontend
bankapi.cors.allowed-origins=http://localhost:5173