# Runs the whole application locally: database, API, and front end.
#
# What this buys over three `docker run` commands: a private network where containers reach
# each other by service name, ordered startup, and one command to bring it all up or down.
# It is also the shape the newman/Postman suite needs in CI - a live API with a real database
# behind it - which is the reason that step was deferred out of the CI workflow.
#
#   docker compose up --build      start everything, rebuilding images
#   docker compose down            stop and remove containers (data survives)
#   docker compose down -v         ...and delete the database volume

name: bankapp

services:

  # A real MongoDB rather than Atlas, so the stack is self-contained: no credential, no
  # network, and a database that can be thrown away and reseeded. The application cannot
  # tell the difference - it speaks the same wire protocol either way, which is the payoff
  # for the repository layer never leaking Mongo specifics upward.
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # `depends_on` alone only waits for the container to START, not for the database to be
      # ready to accept connections. Without this the API would race ahead, fail its first
      # connection, and the whole stack would look broken for a reason that is pure timing.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build: ./bankapi
    environment:
      # No credential, so this one can live in the file. Note the hostname is `mongo` - the
      # service name. Compose gives every service a DNS entry on the private network, so
      # containers address each other by name rather than by IP.
      MONGODB_URI: mongodb://mongo:27017
      # The UI is same-origin through nginx's proxy, so nothing here strictly needs CORS.
      # Set anyway for the case where the API is hit directly on 8080 from a browser.
      BANKAPI_CORS_ALLOWED_ORIGINS: http://localhost:8081
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      # Published only so the API can be exercised directly - curl, Postman, newman. The UI
      # does not use this mapping; it reaches the API over the private network as `api:8080`.
      - "8080:8080"

  ui:
    build: ./bankui
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  mongo-data:
