# nginx configuration for the React bundle. This file is where the second Phase 8 debt is
# finally paid - the SPA fallback.
#
# The problem, restated so the fix is not cargo-culted:
#
#   Clicking <Link to="/customers/2/edit"> makes NO http request. history.pushState rewrites
#   the address bar and React re-renders. The server never hears about that URL.
#
#   Refreshing on that page, or opening a shared link, IS a real GET /customers/2/edit.
#   nginx looks for a file at that path, finds none, and returns 404. The bundle never
#   loads - so the router, the only thing that knows what /customers/:id/edit means, never
#   gets to run. The route exists only inside an app that was never delivered.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Serve the first of these that exists: the path as a file, the path as a directory,
        # then index.html as the last resort.
        #
        # What this trades away: a genuinely wrong URL now returns 200 with the app, not 404.
        # That is why App.jsx carries a path="*" route - the 404 becomes the client's job,
        # because the server can no longer tell a typo from a valid route.
        try_files $uri $uri/ /index.html;
    }

    # Caching. The two rules below are opposites on purpose.
    #
    # Vite fingerprints its output - index-SIhKNWSi.js - so the filename changes whenever the
    # content does. A given name can therefore never mean two different things, which is what
    # makes it safe to cache effectively forever. `immutable` goes further than a long max-age:
    # it tells the browser not even to revalidate on a hard refresh.
    # Note: only add_header here, no `expires`. The expires directive emits a Cache-Control
    # of its own, so using both produces two sets of directives concatenated into one header.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is the opposite case: it is the file that NAMES the current hashes. Cache it
    # and a returning browser keeps loading an old app that references bundles which no longer
    # exist - a deploy that appears to do nothing, then 404s on assets once the old ones are
    # cleaned up.
    #
    # "no-cache" does not mean "do not store". It means "revalidate before reusing", which is
    # what is actually wanted: the browser may keep the file, but must ask whether it changed.
    # A 304 costs one small round trip; a stale index.html costs a broken deploy.
    #
    # `location =` is an exact match, and it does apply to the fallback above: try_files
    # performs an internal redirect to /index.html, which re-runs location matching. So a
    # refresh on /customers/2/edit gets these headers too, not the /assets/ ones.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Deliberately no `location /api` proxy block. Routing /api to the API origin happens at
    # CloudFront, as a second behaviour on the distribution that is already serving this
    # bundle - see AGENTS.md. Doing it here as well would mean two places to change, and one
    # of them silently wrong the first time only one gets updated.
}
